owner: ""                   # GitHub user or org; set by setup.sh, ghr setup github, or the web UI
mode: queue                 # queue | all
global_max: 2               # queue mode only; at most 99, like a repo's max and warm
poll_interval: 10s
start_timeout: 2m
idle_timeout: 5m
disk_high_water: 80         # percent of the Docker data-root filesystem
build_cache_keep: 20GB
history_retention: 30d
labels: [docker]            # added to every runner, besides self-hosted, linux and x64
runner_limits:
  memory_max: 6G
  cpu_quota: 200%
web:                          # browser UI; set its password with ghr web set-password, or in the browser with the code from ghr code; Settings → Web access edits it
  listen: 0.0.0.0:8080
  # hosts: [ghr.lan]          # names a proxy serves it under; IPs and localhost always work
  # trusted_proxies: [10.0.0.2]  # proxies, as IPs or CIDR prefixes, whose X-Forwarded-For names the browser
# github_storage:             # the Artifacts page's quota and cleanup; Settings → GitHub storage edits it
#   included_mb: 500          # the plan's artifact + Packages allowance
#   warn_pct: [70, 90]
#   cleanup_max_age: 2d       # absent is off; at least 24h
#   repos:
#     my-repo: { cleanup: 6h }  # at least 1h, or off
# artifact_store:             # self-hosted artifact storage on an S3 server; Settings → Self-hosted storage edits it
#   endpoint: https://s3.example.com  # or http://ip:port for a private, loopback or link-local IP; no path
#   bucket: gha-artifacts
#   region: us-east-1         # the default when absent
#   cleanup_max_age: 7d       # absent is 7d; off, or at least 24h
#   capacity_gb: 50           # optional, decimal GB, shown on the usage card
#   repos:                    # switched on from the Artifacts page; an entry for a repository not in repos counts as off
#     my-repo: { enabled: true, cleanup: 3d }  # cleanup at least 1h, or off
# jobs:                       # ghr's background tasks; the web UI's Jobs page edits them
#   ghr_update_check: { enabled: true, every: 24h }     # at least 1h
#   runner_update_check: { enabled: true, every: 24h }  # at least 1h; off, GitHub stops assigning jobs to a runner past its forced-update deadline
#   prune: { enabled: true, every: 24h }                # at least 1h; off, old history and logs are kept and a full disk is not pruned
#   storage_measure: { enabled: true, every: 30m }      # at least 5m
#   package_index: { enabled: true, every: 24h }        # at least 1h; refreshes the apt index, then reinstalls missing managed packages
# packages: [ripgrep, shellcheck]  # apt packages from the host's apt sources; ghr installs them and reinstalls any that go missing; Settings → Toolchains edits it
repos: []
# A repository entry, as `ghr repo add` and the web UI write it:
#   - name: my-repo
#     allow_public: true      # required to serve a public repository; the repository page's Serve when public switch sets it
