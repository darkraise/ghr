<title>ghr style directions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Archivo:wght@500;700;900&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600&family=Azeret+Mono:wght@400;600&family=DM+Mono:wght@400;500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700&family=Mona+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: a tab strip of six directions plus the research; each direction is a
   short brief above two fixed-width product frames that zoom to fit. */
:root{
  --bg:#f5f5f3; --card:#ffffff; --fg:#1a1b1e; --mut:#5d6068; --line:#dcdcd7; --acc:#2a3fa0; --onacc:#ffffff; --sunk:#ebebe7;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141518; --card:#1b1c20; --fg:#e8e7e3; --mut:#9a9ca4; --line:#303238; --acc:#a3b0ff; --onacc:#14151a; --sunk:#232429; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141518; --card:#1b1c20; --fg:#e8e7e3; --mut:#9a9ca4; --line:#303238; --acc:#a3b0ff; --onacc:#14151a; --sunk:#232429; color-scheme:dark }
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--ui)}
.page{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:28px 60px;display:flex;flex-direction:column;gap:20px}
.page>header h1{font:600 26px/1.2 var(--ui);margin:0;text-wrap:balance}
.page>header p{margin:6px 0 0;color:var(--mut);max-width:68ch}
.tabs-main{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs-main button{font:500 14px var(--ui);padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
.tabs-main button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs-main button:focus-visible,.modes button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
@media (max-width:820px){.brief{grid-template-columns:1fr}}
.brief h2{font:600 22px/1.2 var(--ui);margin:0}
.brief .thesis{margin:6px 0 0;max-width:60ch}
.facts{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.facts dt{color:var(--mut)} .facts dd{margin:0}
.framehead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:6px}
.framehead h3{font:600 13px var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.modes button{font:500 13px var(--ui);padding:4px 12px;border:0;background:var(--card);color:var(--mut);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.stage{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.panel{display:flex;flex-direction:column;gap:14px}
.research{display:flex;flex-direction:column;gap:22px}
.research h2{font:600 20px/1.2 var(--ui);margin:0}
.research h3{font:600 15px var(--ui);margin:0 0 6px}
.research p,.research li{max-width:76ch}
.research ul{margin:0;padding-left:20px}
.scroll{overflow-x:auto}
.rt{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
.rt th{text-align:left;font-weight:600;color:var(--mut);padding:6px 10px;border-bottom:1px solid var(--line)}
.rt td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rt td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}
.note{color:var(--mut);font-size:14px}

/* ---------- shared product-frame base (every colour comes from the direction's tokens) ---------- */
.mock{width:1280px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;overflow:hidden;position:relative}
.mock *{box-sizing:border-box}
.mock h1,.mock h2,.mock p,.mock ul,.mock fieldset,.mock pre{margin:0;padding:0}
.mock ul{list-style:none}
.mock a{color:var(--acc);text-decoration:none}
.mock .sp{flex:1}
.mock .mono{font-family:var(--fm)}
.mock .mut{color:var(--mut)}
.mock svg.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mock .btn{font:500 13px var(--f);padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:var(--r)}
.mock .btn.pri{background:var(--btn,var(--acc));border-color:var(--btn,var(--acc));color:var(--onacc)}
.mock .ph{display:flex;align-items:flex-end;gap:16px;justify-content:space-between}
.mock .ph h1{font:600 22px/1.2 var(--fd)}
.mock .ph p{color:var(--mut);margin-top:4px}
.mock .acts{display:flex;gap:8px}
.mock .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mock .box>header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.mock h2{font:600 13px var(--f)}
.mock .pad{padding:14px}
.mock .stat .k{color:var(--mut);font-size:12px}
.mock .stat .v{display:flex;align-items:baseline;gap:6px;margin:2px 0 8px}
.mock .stat .v b{font:500 22px var(--fm)}
.mock .stat .v span{color:var(--mut);font-size:12px}
.mock .slots{display:flex;gap:3px}
.mock .slots b{flex:1;height:8px;min-width:14px;background:var(--sunk);border-radius:2px}
.mock .slots b.on{background:var(--run)}
.mock .bar{height:8px;background:var(--sunk);border-radius:2px;overflow:hidden}
.mock .bar i{display:block;height:100%;background:var(--acc)}
.mock svg.spark{display:block;width:100%;height:26px}
.mock .spark path{fill:none;stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mock .spark.q path{stroke:var(--warn)}
.mock .win{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font:12px var(--fm)}
.mock .win b{font-weight:400;padding:2px 8px;color:var(--mut)}
.mock .win b.on{background:var(--sunk);color:var(--fg)}
.mock .lg{display:flex;gap:12px;font-size:12px;color:var(--mut);align-items:center}
.mock .lg i{display:inline-block;width:10px;height:8px;margin-right:5px;border-radius:2px}
.mock table{border-collapse:collapse;width:100%}
.mock th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:7px 14px;border-bottom:1px solid var(--line)}
.mock td{padding:7px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.mock tr:last-child td{border-bottom:0}
.mock td.err{color:var(--bad);font-size:12px}
.mock .meter{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle}
.mock .meter i{width:10px;height:6px;background:var(--sunk)}
.mock .meter i.on{background:var(--run)}
.mock .ev li{display:grid;grid-template-columns:42px 12px minmax(0,1fr);gap:8px;padding:6px 14px;border-bottom:1px solid var(--line)}
.mock .ev li:last-child{border-bottom:0}
.mock .ev time{font-family:var(--fm);color:var(--mut)}
.mock .lv::before{font-weight:700}
.mock .lv-ok::before{content:"✓";color:var(--ok)}
.mock .lv-warn::before{content:"!";color:var(--warn)}
.mock .lv-error::before{content:"✕";color:var(--bad)}
.mock .st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--c)}
.mock .st::before{content:var(--g);font-weight:700}
.mock .st-ok{--c:var(--ok);--g:"✓"} .mock .st-bad{--c:var(--bad);--g:"✕"} .mock .st-run{--c:var(--run);--g:"●"}
.mock .st-warn{--c:var(--warn);--g:"◷"} .mock .st-off{--c:var(--mut);--g:"–"}
.mock .lb{fill:var(--sunk)}
.mock .r-ok{fill:var(--okf,var(--ok));background:var(--okf,var(--ok))}
.mock .r-bad{fill:var(--bad);background:var(--bad)}
.mock .r-run{fill:var(--run);background:var(--run)}
.mock .r-cancel{fill:var(--mut);background:var(--mut)}
.mock .ax{fill:var(--mut);font:10px var(--fm)}
.mock .grid{stroke:var(--line);stroke-width:1}
.mock .rl{fill:var(--onf);font:10.5px var(--fm)}
.mock .rl-ok{fill:var(--onokf,var(--onf))}
/* run page excerpt */
.mock.frag{padding:20px 24px}
.mock .run{display:flex;flex-direction:column;gap:14px}
.mock .run-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mock .run-h b{font:600 16px var(--fd)}
.mock .graph{display:flex;align-items:center;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.mock .gc{display:flex;flex-direction:column;gap:8px}
.mock .node{display:flex;align-items:center;gap:8px;min-width:190px;padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.mock .node.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.mock .node .d{margin-left:auto;color:var(--mut);font:12px var(--fm)}
.mock .wire{width:34px;height:0;border-top:1px solid var(--mut);flex:none}
.mock .rd{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.mock .steps li{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.mock .steps li:last-child{border-bottom:0}
.mock .steps li.on{background:var(--sunk)}
.mock .steps .d{margin-left:auto;color:var(--mut);font:12px var(--fm)}
.mock .steps .st{font-size:0;gap:0} .mock .steps .st::before{font-size:13px}
.mock .log{font:12px/1.65 var(--fm);padding:10px 0;overflow:hidden;white-space:pre}
.mock .log span{display:block;padding:0 12px}
.mock .log .n{display:inline-block;width:26px;color:var(--mut);padding:0;text-align:right;margin-right:12px}
.mock .log .t{display:inline;color:var(--mut);padding:0;margin-right:10px}
.mock .log .e{background:color-mix(in srgb,var(--bad) 14%,transparent);box-shadow:inset 2px 0 0 var(--bad)}
.mock .log .g{color:var(--mut)}
.mock .log i{font-style:normal}

/* ---------- 1 Forge ---------- */
.d1{--f:"Mona Sans",-apple-system,"Segoe UI",sans-serif;--fd:var(--f);--fm:"JetBrains Mono",ui-monospace,monospace;--r:6px}
.d1[data-m="light"]{--bg:#f6f8fa;--panel:#ffffff;--sunk:#eaeef2;--line:#d1d9e0;--fg:#1f2328;--mut:#59636e;--acc:#0969da;--onacc:#fff;--ok:#1a7f37;--bad:#cf222e;--warn:#bc4c00;--run:#9a6700;--onf:#fff;--top:#ffffff}
.d1[data-m="dark"]{--bg:#0d1117;--panel:#151b23;--sunk:#262c36;--line:#3d444d;--fg:#f0f6fc;--mut:#9198a1;--acc:#4493f8;--onacc:#0d1117;--ok:#3fb950;--bad:#f85149;--warn:#db6d28;--run:#d29922;--onf:#0d1117;--top:#010409}
.d1 .top{display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--top)}
.d1 .brand{font:600 15px var(--f);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.d1 .srch{border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--mut);width:260px}
.d1 kbd{font:11px var(--fm);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.d1 .capt{display:flex;align-items:center;gap:8px} .d1 .capt .slots{width:72px}
.d1 .av{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600}
.d1 .tabs{display:flex;gap:4px;padding:0 20px;background:var(--top);border-bottom:1px solid var(--line)}
.d1 .tabs a{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;color:var(--fg);border-bottom:2px solid transparent}
.d1 .tabs a.on{border-color:#fd8c73;font-weight:600}
.d1 .tabs .cnt{background:var(--sunk);border-radius:99px;padding:0 7px;font-size:12px}
.d1 .tabs .gap{width:1px;background:var(--line);margin:8px 8px}
.d1 main{max-width:1180px;margin:0 auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:16px}
.d1 .box>header{background:var(--bg);border-radius:6px 6px 0 0}
.d1 .statrow{display:grid;grid-template-columns:repeat(4,1fr)}
.d1 .stat{padding:12px 14px;border-right:1px solid var(--line)} .d1 .stat:last-child{border:0}
.d1 .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.d1 .st{background:color-mix(in srgb,var(--c) 14%,transparent);padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500}
.d1 .steps .st{background:none;padding:0}
.d1 td:first-child{font-weight:600;color:var(--acc)}

/* ---------- 2 Hairline ---------- */
.d2{--f:"Geist",-apple-system,"Segoe UI",sans-serif;--fd:var(--f);--fm:"Geist Mono",ui-monospace,monospace;--r:6px}
.d2[data-m="dark"]{--bg:#0a0a0a;--panel:#0a0a0a;--sunk:#1a1a1a;--line:#262626;--fg:#ededed;--mut:#8f8f8f;--acc:#ededed;--onacc:#0a0a0a;--ok:#4cc38a;--bad:#ff6369;--warn:#f1a10d;--run:#52a8ff;--okf:#3a3a3a;--onf:#0a0a0a;--onokf:#cfcfcf}
.d2[data-m="light"]{--bg:#ffffff;--panel:#ffffff;--sunk:#f2f2f2;--line:#e6e6e6;--fg:#171717;--mut:#666666;--acc:#171717;--onacc:#fff;--ok:#18794e;--bad:#cd2b31;--warn:#a35200;--run:#0068d6;--okf:#d4d4d4;--onf:#fff;--onokf:#3a3a3a}
.d2 .top{display:flex;align-items:center;gap:22px;padding:0 32px;height:52px;border-bottom:1px solid var(--line)}
.d2 .brand{font:600 15px var(--f);letter-spacing:-.02em}
.d2 .host{color:var(--mut);font:12px var(--fm)}
.d2 .top nav{display:flex;gap:18px} .d2 .top nav a{color:var(--mut)} .d2 .top nav a.on{color:var(--fg)}
.d2 .kk{border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--mut);font:12px var(--fm)}
.d2 main{padding:36px 32px 32px;display:flex;flex-direction:column;gap:30px}
.d2 .ph h1{font:600 28px/1.1 var(--f);letter-spacing:-.03em}
.d2 .statrow{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.d2 .stat{padding:16px 20px 16px 0;border-right:1px solid var(--line);margin-right:20px} .d2 .stat:last-child{border:0;margin:0}
.d2 .sec>header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.d2 h2{font:500 12px var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.d2 .two{display:grid;grid-template-columns:3fr 2fr;gap:40px}
.d2 th,.d2 td{padding-left:0} .d2 .ev li{padding-left:0}
.d2 .st{color:var(--fg)}
.d2 .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.d2 .slots b,.d2 .bar{height:4px;border-radius:0}
.d2 .graph,.d2 .node{background:transparent}

/* ---------- 3 Console ---------- */
.d3{--f:"JetBrains Mono",ui-monospace,monospace;--fd:var(--f);--fm:var(--f);--r:0px;font-size:12.5px}
.d3[data-m="dark"]{--bg:#111210;--panel:#111210;--sunk:#1e1f1b;--line:#45463f;--fg:#d6d3c4;--mut:#8f8d7e;--acc:#e5b567;--onacc:#111210;--ok:#8fbf7f;--bad:#e8705f;--warn:#dd8f4e;--run:#7fb7ce;--onf:#111210}
.d3[data-m="light"]{--bg:#fafaf6;--panel:#fafaf6;--sunk:#e9e8df;--line:#a9a79b;--fg:#1c1c1a;--mut:#636157;--acc:#855600;--onacc:#fafaf6;--ok:#2f6f2a;--bad:#b3261e;--warn:#a34a00;--run:#1c6a87;--onf:#fafaf6}
.d3 .tl{display:flex;gap:18px;padding:5px 14px;background:var(--sunk)}
.d3 .tl b{color:var(--acc);font-weight:600}
.d3 .tl kbd{font:inherit;color:var(--onacc);background:var(--acc);padding:0 5px;margin-right:6px}
.d3 .tgrid{display:grid;grid-template-columns:190px minmax(0,1fr) 380px;gap:10px;padding:12px 14px}
.d3 .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.d3 fieldset{border:1px solid var(--line);padding:8px 12px 10px;min-width:0}
.d3 legend{padding:0 6px;color:var(--acc)}
.d3 .nav li{display:flex;gap:10px;padding:2px 0} .d3 .nav li.on{background:var(--acc);color:var(--onacc);margin:0 -6px;padding:2px 6px}
.d3 .nav .n{color:var(--mut)} .d3 .nav li.on .n{color:inherit}
.d3 .tlanes{line-height:1.25;white-space:pre;overflow:hidden}
.d3 .tlanes .e{color:var(--line)} .d3 .t-ok{color:var(--ok)} .d3 .t-bad{color:var(--bad)} .d3 .t-run{color:var(--run)} .d3 .t-cancel{color:var(--mut)}
.d3 .kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:2px 10px}
.d3 .kv dt,.d3 .kv dd{margin:0} .d3 .kv dt{color:var(--mut)}
.d3 th,.d3 td{padding:3px 12px 3px 0;border:0} .d3 th{border-bottom:1px dashed var(--line)}
.d3 .ev li{padding:2px 0;border:0}
.d3 .st::before{content:"["} .d3 .st::after{content:"]"} .d3 .st{gap:0;text-transform:lowercase}
.d3 .meter{display:none}
.d3 .steps .st{font-size:inherit}
.d3 .graph,.d3 .node{background:transparent} .d3 .steps li{border:0;padding:2px 8px} .d3 .steps li.on{background:var(--acc);color:var(--onacc)} .d3 .steps li.on .d,.d3 .steps li.on .st{color:inherit}
.d3 .node.sel{box-shadow:none;border-style:double;border-width:3px}

/* ---------- 4 Logbook ---------- */
.d4{--f:"Hanken Grotesk",system-ui,sans-serif;--fd:"Newsreader",Georgia,serif;--fm:"DM Mono",ui-monospace,monospace;--r:3px;font-size:14px}
.d4[data-m="light"]{--bg:#f4f4f1;--panel:#fbfbf9;--sunk:#e6e6e0;--line:#d6d6ce;--fg:#1b1c20;--mut:#5f626b;--acc:#2b3a9e;--onacc:#fff;--ok:#2c6e49;--bad:#b3322b;--warn:#8a5a00;--run:#2b3a9e;--okf:#9db8a8;--onf:#fff;--onokf:#16301f}
.d4[data-m="dark"]{--bg:#17181b;--panel:#1d1f23;--sunk:#2a2c31;--line:#373a41;--fg:#e6e4de;--mut:#9a9ca3;--acc:#9aa8ff;--onacc:#14151a;--ok:#7fc79b;--bad:#f08a80;--warn:#e0b060;--run:#9aa8ff;--okf:#3f5a4b;--onf:#14151a;--onokf:#d7eadf}
.d4{display:grid;grid-template-columns:56px minmax(0,1fr)}
.d4.frag{display:block}
.d4 .rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line)}
.d4 .rail .g{font:500 20px var(--fd);margin-bottom:12px}
.d4 .rail a{width:36px;height:36px;display:grid;place-items:center;color:var(--mut);border-radius:3px}
.d4 .rail a.on{color:var(--fg);background:var(--sunk)}
.d4 .rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
.d4 main{padding:34px 48px 36px;display:flex;flex-direction:column;gap:28px}
.d4 .date{font:13px var(--fm);color:var(--mut)}
.d4 .lead h1{font:400 34px/1.18 var(--fd);max-width:24ch;margin-top:8px;letter-spacing:-.01em}
.d4 .lead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.d4 .lede{margin-top:10px;max-width:60ch;color:var(--mut);font-size:15px}
.d4 .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px}
.d4 .col{display:flex;flex-direction:column;gap:26px;min-width:0}
.d4 h2{font:500 19px var(--fd);padding-bottom:6px;border-bottom:1px solid var(--fg);margin-bottom:10px;display:flex;align-items:baseline;gap:12px}
.d4 h2 .win{margin-left:auto}
.d4 th,.d4 td{padding-left:0}
.d4 .box h2{font:600 13px var(--f);border:0;margin:0;padding:0}
.d4 .box th,.d4 .box td{padding-left:14px}
.d4 .facts4{display:grid;gap:14px}
.d4 .facts4 .k{font-size:13px}

function panelHTML(d){return `<section class="panel" role="tabpanel" id="${d.id}" aria-labelledby="t-${d.id}" hidden>
 <div class="brief"><div><h2>${d.n.replace(/^\d+ · /,'')}</h2><p class="thesis">${d.t}</p></div><dl class="facts">${d.f.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl></div>
 <div class="framehead"><h3>Dashboard</h3><div class="modes" role="group" aria-label="Colour mode for this direction"><button type="button" data-set="light" aria-pressed="${d.m=='light'}">Light</button><button type="button" data-set="dark" aria-pressed="${d.m=='dark'}">Dark</button></div></div>
 <div class="stage"><div class="mock ${d.cls}" data-m="${d.m}">${d.fn()}</div></div>
 <div class="framehead"><h3>Run page, graph, steps and log</h3></div>
 <div class="stage"><div class="mock frag ${d.cls}" data-m="${d.m}">${runPanel()}</div></div></section>`}

function researchHTML(){let i=0;const rows=g=>g.map(s=>`<tr><td>${++i}</td><td>${s[0]}<div class="note">${s[1]}</div></td><td>${s[2]}</td></tr>`).join('');
 const live=LIVE.length?`<div><h3>Running product interfaces, opened in a browser and measured</h3><div class="scroll"><table class="rt"><thead><tr><th>#</th><th>Product</th><th>What it does</th></tr></thead><tbody>${rows(LIVE)}</tbody></table></div></div>`:'';
 return `<section class="panel research" role="tabpanel" id="research" aria-labelledby="t-research" hidden>
 <div><h2>Research behind the directions</h2><p class="note">Each row is a page that was actually opened. Pages that failed to load are left out.</p></div>
 ${live}
 ${SOURCES.map(([h,g])=>`<div><h3>${h}</h3><div class="scroll"><table class="rt"><thead><tr><th>#</th><th>Source</th><th>What was taken from it</th></tr></thead><tbody>${rows(g)}</tbody></table></div></div>`).join('')}
 <div><h3>Rules every direction keeps</h3><ul>
  <li>One screen, with what is failed, stuck or waiting ahead of what is fine. Lines, bars and lanes only.</li>
  <li>Every state is a colour, a shape or glyph, and a word. One vocabulary on every page.</li>
  <li>Hue is reserved for state. Each direction has one interaction colour at most.</li>
  <li>Tables put the readable name first, use tabular numerals, and keep actions visible.</li>
  <li>Logs are monospaced at 12 to 13px with timestamps, the failing step open and the error line marked.</li>
  <li>Light and dark both ship, following the system setting.</li></ul></div>
 <div><h3>What the current look has against it</h3><p>Navy-black with a single bright cyan accent sits close to the "neon accent on dark" pattern that the critiques list as a mark of generated design. Each direction here moves away from it in a different way.</p></div>
 </section>`}

const tabs=document.getElementById('tabs'),panels=document.getElementById('panels');
const ALL=[...DIRS.map(d=>[d.id,d.n]),['research','Research']];
tabs.innerHTML=ALL.map(([id,n])=>`<button type="button" role="tab" id="t-${id}" aria-controls="${id}" aria-selected="false">${n}</button>`).join('');
panels.innerHTML=DIRS.map(panelHTML).join('')+researchHTML();
function fit(){document.querySelectorAll('.stage').forEach(s=>{const w=s.clientWidth;if(w)s.firstElementChild.style.zoom=Math.max(.6,Math.min(1.2,(w-2)/1280))})}
function show(id){if(!ALL.some(a=>a[0]==id))id=ALL[0][0];ALL.forEach(([k])=>{document.getElementById(k).hidden=k!=id;document.getElementById('t-'+k).setAttribute('aria-selected',k==id)});fit()}
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.getAttribute('aria-controls');show(id);try{history.replaceState(null,'','#'+id)}catch(_){}});
panels.addEventListener('click',e=>{const b=e.target.closest('.modes button');if(!b)return;const p=b.closest('.panel');p.querySelectorAll('.mock').forEach(m=>m.dataset.m=b.dataset.set);p.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x==b))});
addEventListener('resize',fit);addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
