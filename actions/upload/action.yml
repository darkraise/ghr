name: Upload a build artifact (ghr)
description: Upload a build artifact to the store ghr set up for this repository, or to GitHub's artifact storage when the repository is not switched on in ghr
author: darkraise
inputs:
  name:
    description: Artifact name
    default: artifact
  path:
    description: A file, directory or wildcard pattern that describes what to upload
    required: true
  if-no-files-found:
    description: >
      The desired behavior if no files are found using the provided path.
      warn: output a warning but do not fail the action;
      error: fail the action with an error message;
      ignore: do not output any warnings or errors, the action does not fail
    default: warn
  retention-days:
    description: >
      Duration after which the artifact will expire in days. 0 means using the default retention
      (ghr's cleanup age in the artifact store). Minimum 1 day, maximum 90 days.
  compression-level:
    description: >
      The level of compression for Zlib to be applied to the artifact archive, from 0 (no compression)
      through 6 (default) to 9 (best compression).
    default: '6'
  overwrite:
    description: >
      If true, an artifact with a matching name will be replaced by the new one.
      If false, the action will fail if an artifact for the given name already exists.
    default: 'false'
  include-hidden-files:
    description: If true, hidden files will be included in the artifact.
    default: 'false'
  store:
    description: >
      The GHR_ARTIFACT_STORE repository variable ghr writes. Empty reads the GHR_ARTIFACT_STORE
      environment variable; when both are empty the artifact goes to GitHub.
    default: ''
  key:
    description: The job key from the GHR_ARTIFACT_KEY repository secret. Needed when the store is set.
    default: ''
  version:
    description: >
      The ghr release, such as v0.2.0, to fetch ghr-artifact from. Empty uses the release tag this
      action is referenced by.
    default: ''
outputs:
  artifact-id:
    description: The GitHub artifact ID; empty when the artifact went to the artifact store
    value: ${{ steps.github.outputs.artifact-id }}
  artifact-url:
    description: The GitHub artifact URL; empty when the artifact went to the artifact store
    value: ${{ steps.github.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded artifact
    value: ${{ steps.ghr.outputs.artifact-digest || steps.github.outputs.artifact-digest }}
  object-key:
    description: The artifact's object key in the artifact store; empty when it went to GitHub
    value: ${{ steps.ghr.outputs.object-key }}
runs:
  using: composite
  steps:
    - name: Upload to GitHub
      id: github
      if: inputs.store == '' && env.GHR_ARTIFACT_STORE == ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
    - name: Fetch ghr-artifact
      id: fetch
      if: inputs.store != '' || env.GHR_ARTIFACT_STORE != ''
      shell: bash
      env:
        GHR_VERSION: ${{ inputs.version }}
        GHR_ACTION_REF: ${{ github.action_ref }}
      run: |
        tool=$(bash "$GITHUB_ACTION_PATH/../lib/fetch.sh")
        echo "path=$tool" >> "$GITHUB_OUTPUT"
    - name: Upload to the artifact store
      id: ghr
      if: inputs.store != '' || env.GHR_ARTIFACT_STORE != ''
      shell: bash
      env:
        GHR_TOOL: ${{ steps.fetch.outputs.path }}
        GHR_ARTIFACT_STORE: ${{ inputs.store || env.GHR_ARTIFACT_STORE }}
        GHR_ARTIFACT_KEY: ${{ inputs.key }}
        IN_NAME: ${{ inputs.name }}
        IN_PATH: ${{ inputs.path }}
        IN_IF_NO_FILES_FOUND: ${{ inputs.if-no-files-found }}
        IN_RETENTION_DAYS: ${{ inputs.retention-days }}
        IN_COMPRESSION_LEVEL: ${{ inputs.compression-level }}
        IN_OVERWRITE: ${{ inputs.overwrite }}
        IN_INCLUDE_HIDDEN_FILES: ${{ inputs.include-hidden-files }}
      run: |
        "$GHR_TOOL" upload \
          --name "$IN_NAME" \
          --path "$IN_PATH" \
          --if-no-files-found "$IN_IF_NO_FILES_FOUND" \
          --retention-days "${IN_RETENTION_DAYS:-0}" \
          --compression-level "$IN_COMPRESSION_LEVEL" \
          --overwrite="$IN_OVERWRITE" \
          --include-hidden-files="$IN_INCLUDE_HIDDEN_FILES"
