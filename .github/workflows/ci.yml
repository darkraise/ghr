name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 180s ./...
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: no inlined fonts
        run: "ls dist/assets/*.css > /dev/null && ! grep -q 'data:font' dist/assets/*.css"
        working-directory: web

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: version
        run: |
          # A release is created with --target, so the tag is made by GitHub and no tag push has to trigger another workflow.
          current=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "$current" ]; then
            echo "HEAD is already released as $current" >&2
            echo "VERSION=" >> "$GITHUB_ENV"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$next" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.VERSION != ''
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        if: env.VERSION != ''
        working-directory: web
        run: npm ci && npm run build && test -f dist/index.html
      - name: build
        if: env.VERSION != ''
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/ghr
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/ghr/ghr ./cmd/ghr
          cp hooks/job-started.sh hooks/job-completed.sh dist/ghr/
          chmod 0755 dist/ghr/*
          tar -C dist -czf dist/ghr_linux_amd64.tar.gz ghr
          (cd dist && sha256sum ghr_linux_amd64.tar.gz > checksums.txt)
      - name: publish
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/ghr_linux_amd64.tar.gz dist/checksums.txt --target "$GITHUB_SHA" --generate-notes
