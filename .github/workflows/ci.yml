name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 180s ./...
      - name: setup.sh tests
        run: bash deploy/tests/setup_test.sh
      - name: fetch.sh tests
        run: bash actions/lib/fetch_test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:tz
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: no inlined fonts
        run: "ls dist/assets/*.css > /dev/null && ! grep -q 'data:font' dist/assets/*.css"
        working-directory: web

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: version
        run: |
          # A release is created with --target, so the tag is made by GitHub and no tag push has to trigger another workflow.
          current=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "$current" ]; then
            echo "HEAD is already released as $current" >&2
            echo "VERSION=" >> "$GITHUB_ENV"
            exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "VERSION=$next" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.VERSION != ''
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web
        if: env.VERSION != ''
        working-directory: web
        run: npm ci && npm run build && test -f dist/index.html
      - name: build
        if: env.VERSION != ''
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/ghr
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/ghr/ghr ./cmd/ghr
          cp hooks/job-started.sh hooks/job-completed.sh deploy/config.example.yaml dist/ghr/
          chmod 0755 dist/ghr/ghr dist/ghr/*.sh
          tar -C dist -czf dist/ghr_linux_amd64.tar.gz ghr
          tar -tzf dist/ghr_linux_amd64.tar.gz | grep -qx ghr/config.example.yaml
          (cd dist && sha256sum ghr_linux_amd64.tar.gz > checksums.txt)
      - name: ghr-artifact
        if: env.VERSION != ''
        env:
          CGO_ENABLED: "0"
        run: |
          # These stay out of checksums.txt: older setup.sh copies verify every line of that file.
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=
            [ "$os" != windows ] || ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/ghr-artifact_${os}_${arch}${ext}" ./cmd/ghr-artifact
          done
          (cd dist && sha256sum ghr-artifact_linux_amd64 ghr-artifact_linux_arm64 ghr-artifact_windows_amd64.exe > ghr-artifact-checksums.txt)
          test "$(dist/ghr-artifact_linux_amd64 version)" = "$VERSION"
      - name: setup.sh
        if: env.VERSION != ''
        run: |
          # The published copy installs its own release by default. It stays out of
          # checksums.txt: older setup.sh copies verify every line of that file.
          sed 's/^GHR_VERSION="${GHR_VERSION:-latest}"$/GHR_VERSION="${GHR_VERSION:-'"$VERSION"'}"/' deploy/setup.sh > dist/setup.sh
          grep -qxF "GHR_VERSION=\"\${GHR_VERSION:-$VERSION}\"" dist/setup.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.VERSION != ''
        with:
          subject-path: |
            dist/ghr_linux_amd64.tar.gz
            dist/setup.sh
            dist/ghr-artifact_linux_amd64
            dist/ghr-artifact_linux_arm64
            dist/ghr-artifact_windows_amd64.exe
      - name: publish
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/ghr_linux_amd64.tar.gz dist/checksums.txt dist/setup.sh \
            dist/ghr-artifact_linux_amd64 dist/ghr-artifact_linux_arm64 dist/ghr-artifact_windows_amd64.exe \
            dist/ghr-artifact-checksums.txt --target "$GITHUB_SHA" --generate-notes
