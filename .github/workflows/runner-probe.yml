name: Runner probe

# Dispatched by the runner job of ci.yml to learn whether ghr's runner picks up
# work. It does nothing else.
run-name: probe ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Identifies the dispatching CI run
        required: true
        type: string

permissions: {}

jobs:
  probe:
    runs-on: [self-hosted, ghr-linux]
    timeout-minutes: 5
    steps:
      - run: echo "self-hosted runner reachable"
